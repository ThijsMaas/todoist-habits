[project]
name = "todoist-habits"
version = "0.1.0"
description = "Self-hosted habit tracker for Todoist: stats in task descriptions, missed-day logging, x-per-week goals"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Thijs" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
todoist-habits = "habits.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["habits*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
